<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" fill="none">
  <!-- Monogram Circle Badge -->
  <circle cx="65" cy="65" r="54" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="320" opacity="0.9" />
  <circle cx="65" cy="65" r="48" fill="#12141A" />
  
  <!-- H&D Letters Monogram -->
  <text x="65" y="62" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">H<tspan font-size="20" font-weight="300" fill="#A0AEC0">&amp;</tspan>D</text>
  
  <text x="65" y="82" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">HAIR LAB</text>
  
  <!-- Right Brand Typography -->
  <g transform="translate(140, 36)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="2">H&amp;D HAIR LAB</text>
    <text x="2" y="54" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#94A3B8" letter-spacing="3.5">STUDIO OF COLORING AND CARE</text>
    
    <!-- Accent Line -->
    <line x1="2" y1="64" x2="160" y2="64" stroke="#FFFFFF" stroke-width="1" opacity="0.4" />
  </g>
</svg>
