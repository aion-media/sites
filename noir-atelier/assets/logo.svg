<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 50" width="260" height="50">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Emblem Monogram -->
  <g transform="translate(4, 5)">
    <rect x="0" y="0" width="40" height="40" rx="10" fill="#131620" stroke="url(#goldGrad)" stroke-width="1.5" />
    <path d="M12 28 V12 L28 28 V12" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="12" r="2" fill="#FCD34D" filter="url(#glow)" />
  </g>

  <!-- Text Branding -->
  <text x="56" y="27" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="4" fill="#FFFFFF">NOIR</text>
  <text x="56" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="9" letter-spacing="3.5" fill="url(#goldGrad)">HAIR ATELIER</text>
  <circle cx="165" cy="38" r="1.5" fill="#E5A93C" />
  <text x="172" y="41" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="500" font-size="8.5" letter-spacing="2" fill="#94A3B8">STUDIO &amp; SPA</text>
</svg>
