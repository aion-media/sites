<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Stylized CODE wordmark in bold black metal -->
  <text x="5" y="48" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="4" fill="#121316">
    CODE
  </text>
  <!-- Stylized 606 in signature italic font -->
  <text x="180" y="48" font-family="'Playfair Display', Georgia, serif" font-size="46" font-style="italic" font-weight="700" letter-spacing="1" fill="#121316">
    606
  </text>
  <!-- Terracotta accent divider line matching the official menu -->
  <line x1="215" y1="58" x2="310" y2="58" stroke="#E87A36" stroke-width="4" stroke-linecap="round" />
  <!-- Barbershop subline -->
  <text x="6" y="70" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="6" fill="#E87A36">
    BARBERSHOP
  </text>
</svg>
