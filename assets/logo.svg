<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 130" width="100%" height="100%">
  <!-- EVO Beauty Space Official Vector Logo (Transparent Background) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@600;700&amp;display=swap');
      .evo-letters {
        font-family: 'Cinzel', 'Playfair Display', Georgia, serif;
        font-size: 88px;
        font-weight: 700;
        fill: #B58A63;
        letter-spacing: 0.05em;
      }
      .badge-bg {
        fill: #3E531B;
        rx: 3px;
        ry: 3px;
      }
      .badge-text {
        font-family: 'Montserrat', -apple-system, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #FFFFFF;
        letter-spacing: 0.42em;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Letter E -->
  <text x="12" y="78" class="evo-letters">E</text>

  <!-- Letter V with exact olive leaf -->
  <text x="78" y="78" class="evo-letters">V</text>

  <!-- Firm Leaf on letter V -->
  <g transform="translate(132, 14) rotate(18) scale(0.38)">
    <!-- Leaf Body -->
    <path d="M 68 18 
             C 38 16, 16 40, 18 68 
             C 19 82, 34 94, 50 90 
             C 74 86, 88 54, 86 30 
             C 86 22, 78 19, 68 18 Z" 
          fill="#445914" />
    <!-- Leaf Stem -->
    <path d="M 38 78 
             C 32 86, 24 94, 16 100 
             C 14 102, 12 101, 13 99
             C 19 91, 28 82, 34 76 Z" 
          fill="#33440E" />
    <!-- Subtle Inner Vein -->
    <path d="M 36 76 C 46 58, 56 42, 66 26" 
          stroke="#2E3D0C" 
          stroke-width="3" 
          stroke-linecap="round" 
          fill="none" />
  </g>

  <!-- Letter O -->
  <text x="168" y="78" class="evo-letters">O</text>

  <!-- Plaque BEAUTY SPACE -->
  <rect x="12" y="94" width="256" height="26" class="badge-bg" />
  <text x="146" y="112" class="badge-text">BEAUTY SPACE</text>
</svg>
